[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-rich-editor"
dynamic = ["version"]
description = "A full rich text editor for pyxpo apps: Tiptap in WKWebView on iOS and Mac, WebView on Android, an iframe on the web."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "rich-text", "editor", "wysiwyg", "html", "tiptap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a3,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo-rich-editor"
Documentation = "https://github.com/pyxpo/pyxpo-rich-editor/blob/main/README.md"
Changelog = "https://github.com/pyxpo/pyxpo-rich-editor/blob/main/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo-rich-editor"
Issues = "https://github.com/pyxpo/pyxpo-rich-editor/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
rich-editor = "pyxpo_rich_editor"

[tool.setuptools]
packages = ["pyxpo_rich_editor"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_rich_editor.__version__" }

[tool.setuptools.package-data]
pyxpo_rich_editor = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*", "web.js"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
